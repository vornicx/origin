name: Weekly Audit

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    outputs:
      vuln_count: ${{ steps.pip_audit.outputs.vuln_count }}
      bandit_issues: ${{ steps.bandit.outputs.issues }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit bandit[toml]

      - name: pip-audit (dependency CVEs)
        id: pip_audit
        run: |
          set +e
          pip-audit --requirement requirements.txt --skip-editable \
            --format json --output pip-audit-report.json
          EXIT=$?
          COUNT=$(python -c "import json,sys; d=json.load(open('pip-audit-report.json')); print(sum(len(v['vulns']) for v in d.get('dependencies',[])))" 2>/dev/null || echo 0)
          echo "vuln_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "### pip-audit: $COUNT vulnerability/ies found" >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT
        continue-on-error: true

      - name: bandit (static security analysis)
        id: bandit
        run: |
          set +e
          bandit -r . --exclude ./venv,./.venv,./tests,./frontend \
            --format json --output bandit-report.json -ll
          EXIT=$?
          ISSUES=$(python -c "import json; d=json.load(open('bandit-report.json')); print(len(d.get('results',[])))" 2>/dev/null || echo 0)
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
          echo "### bandit: $ISSUES medium/high issue(s)" >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT
        continue-on-error: true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: |
            pip-audit-report.json
            bandit-report.json
          retention-days: 90

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.cov.outputs.pct }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        id: cov
        run: |
          python -m pytest tests/ \
            --cov=core --cov=api --cov=db \
            --cov-report=json:coverage.json \
            --cov-report=term-missing \
            --timeout=60 -q || true
          PCT=$(python -c "import json; d=json.load(open('coverage.json')); print(round(d['totals']['percent_covered'],1))" 2>/dev/null || echo 0)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "### Coverage: ${PCT}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.json
          retention-days: 90

  quality-metrics:
    name: Record Quality Metrics
    runs-on: ubuntu-latest
    needs: [security-audit, coverage]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record metrics snapshot
        env:
          VULN_COUNT: ${{ needs.security-audit.outputs.vuln_count }}
          BANDIT_ISSUES: ${{ needs.security-audit.outputs.bandit_issues }}
          COVERAGE_PCT: ${{ needs.coverage.outputs.coverage_pct }}
        run: |
          python scripts/quality_metrics.py record \
            --vuln-count "$VULN_COUNT" \
            --bandit-issues "$BANDIT_ISSUES" \
            --coverage "$COVERAGE_PCT"

      - name: Print trend summary
        run: python scripts/quality_metrics.py trend --last 8

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics-${{ github.run_id }}
          path: metrics/history.jsonl
          retention-days: 365

  open-issue-on-regression:
    name: Flag Regressions
    runs-on: ubuntu-latest
    needs: [security-audit, coverage]
    if: >
      needs.security-audit.outputs.vuln_count != '0' ||
      needs.security-audit.outputs.bandit_issues != '0'

    steps:
      - uses: actions/checkout@v4

      - name: Create regression issue
        uses: actions/github-script@v7
        with:
          script: |
            const vulns  = '${{ needs.security-audit.outputs.vuln_count }}';
            const bandit = '${{ needs.security-audit.outputs.bandit_issues }}';
            const cov    = '${{ needs.coverage.outputs.coverage_pct }}';
            const date   = new Date().toISOString().slice(0, 10);

            const title = `[Audit ${date}] ${vulns} CVE(s), ${bandit} bandit issue(s)`;
            const body = [
              `## Weekly Audit Report — ${date}`,
              '',
              `| Metric | Value |`,
              `|---|---|`,
              `| Dependency CVEs | ${vulns} |`,
              `| Bandit (medium+high) | ${bandit} |`,
              `| Test coverage | ${cov}% |`,
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Please triage and resolve before next release.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'audit',
              state: 'open',
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['audit', 'security'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            }
