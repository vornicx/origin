services:
  api:
    build: .
    container_name: origin-api
    ports:
      - "9001:9001"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/origin
      - REDIS_URL=redis://redis:6379
      - LOG_FORMAT=json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./screenshots:/app/screenshots
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  db:
    image: pgvector/pgvector:pg16
    container_name: origin-db
    environment:
      POSTGRES_DB: origin
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: origin-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  crucix:
    build: ./crucix
    container_name: origin-crucix
    ports:
      - "${CRUCIX_PORT:-3117}:${CRUCIX_PORT:-3117}"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${CRUCIX_PORT:-3117}
    volumes:
      - ./crucix/runs:/app/runs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3117/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  osiris:
    build: ./osiris
    container_name: origin-osiris
    ports:
      - "${OSIRIS_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
